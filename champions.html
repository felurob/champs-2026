function PaymentsTab({ state, setState }) {
  const tripBuyIn = state.tripBuyIn || { amountPerPlayer: 150, payments: {} };

  // Per-round expected cash from each player based on their participation.
  // Skins entry $20 (skins pot $18 + $2 admin), IN $5, BB $5. Total $30 if fully entered.
  const expectedRoundContrib = (round, playerId) => {
    const part = round.participants[playerId];
    if (!part?.active) return 0;
    return (part.inSkins ? 20 : 0) + (part.inIndividualNet ? 5 : 0) + (part.inBestBall ? 5 : 0);
  };

  // Cumulative round-payout net per player (won − contributed) across all rounds.
  const cumulativeNet = useMemo(() => {
    const map = Object.fromEntries(state.players.map((p) => [p.id, 0]));
    for (const r of state.rounds) {
      const res = computeRoundResults(r, state.players);
      for (const [pid, l] of Object.entries(res.ledger)) {
        map[pid] = (map[pid] || 0) + l.net;
      }
    }
    return map;
  }, [state.rounds, state.players]);

  const updateBuyInAmount = (v) =>
    setState((s) => ({ ...s, tripBuyIn: { ...s.tripBuyIn, amountPerPlayer: Number(v) || 0 } }));

  const updatePayment = (pid, patch) =>
    setState((s) => ({
      ...s,
      tripBuyIn: {
        ...s.tripBuyIn,
        payments: {
          ...s.tripBuyIn.payments,
          [pid]: { ...(s.tripBuyIn.payments?.[pid] || {}), ...patch },
        },
      },
    }));

  const updateRoundPaid = (rid, pid, paid) =>
    setState((s) => ({
      ...s,
      rounds: s.rounds.map((r) =>
        r.id !== rid
          ? r
          : {
              ...r,
              participants: {
                ...r.participants,
                [pid]: { ...(r.participants[pid] || {}), paid },
              },
            }
      ),
    }));

  // Per-player expected total = sum of expected per-round contributions across
  // every round where the player is currently marked Active (with their side-game
  // toggles). Computed live so it adjusts as Fernando assigns participation.
  const expectedTotal = (playerId) =>
    state.rounds.reduce((acc, r) => acc + expectedRoundContrib(r, playerId), 0);

  const totalDue = state.players.reduce((acc, p) => acc + expectedTotal(p.id), 0);
  const totalPaid = state.players.reduce(
    (acc, p) => acc + Number(tripBuyIn.payments?.[p.id]?.paid || 0),
    0
  );
  const totalBalance = totalDue - totalPaid;

  const roundExpectedTotal = (r) =>
    state.players.reduce((acc, p) => acc + expectedRoundContrib(r, p.id), 0);
  const roundPaidTotal = (r) =>
    state.players.reduce(
      (acc, p) =>
        acc + (r.participants[p.id]?.paid ? expectedRoundContrib(r, p.id) : 0),
      0
    );

  return (
    <div className="space-y-4">
      <Card title="Trip-level buy-in">
        <div className="text-xs px-1 py-2 mb-2" style={{ color: palette.inkSoft }}>
          Each player's <strong>Due</strong> is computed automatically from their participation across the 5 rounds — sum of $20 skins + $5 individual net + $5 best ball for every round where they're marked Active with the relevant toggles on the Round → Participation tab. Adjust participation first; the totals here update live.
        </div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
          <KPI label="Players" value={String(state.players.length)} />
          <KPI label="Total due (computed)" value={fmt$(totalDue)} />
          <KPI
            label={totalBalance >= 0 ? "Outstanding" : "Surplus"}
            value={fmt$(Math.abs(totalBalance))}
            sub={`Collected ${fmt$(totalPaid)}`}
          />
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm" style={{ fontVariantNumeric: "tabular-nums" }}>
            <thead>
              <tr style={{ background: "#F7F5F0", borderBottom: `1px solid ${palette.rule}` }}>
                <th className="text-left px-3 py-2 font-medium">Player</th>
                <th className="text-right px-3 py-2 font-medium" style={{ width: 70 }}>Rds</th>
                <th className="text-right px-3 py-2 font-medium" style={{ width: 90 }}>Due</th>
                <th className="text-right px-3 py-2 font-medium" style={{ width: 110 }}>Paid</th>
                <th className="text-right px-3 py-2 font-medium" style={{ width: 110 }}>Balance</th>
                <th className="text-left px-3 py-2 font-medium" style={{ width: 130 }}>Method</th>
                <th className="text-left px-3 py-2 font-medium" style={{ width: 140 }}>Date</th>
                <th className="text-left px-3 py-2 font-medium">Notes</th>
                <th className="text-center px-3 py-2 font-medium" style={{ width: 90 }}>Status</th>
              </tr>
            </thead>
            <tbody>
              {state.players.map((p) => {
                const pay = tripBuyIn.payments?.[p.id] || {};
                const due = expectedTotal(p.id);
                const activeRounds = state.rounds.filter(
                  (r) => r.participants[p.id]?.active
                ).length;
                const paid = Number(pay.paid || 0);
                // Player-centric balance: negative = player owes Fernando ;
                // positive = Fernando owes player (overpaid).
                const bal = paid - due;
                const status =
                  due === 0
                    ? "—"
                    : bal === 0 && paid > 0
                    ? "Settled"
                    : bal > 0
                    ? "Surplus"
                    : paid > 0
                    ? "Partial"
                    : "Owes";
                const tone =
                  status === "Settled" ? "open" : status === "Surplus" ? "A" : status === "Partial" ? "B" : status === "—" ? "open" : "locked";
                return (
                  <tr key={p.id} style={{ borderBottom: `1px solid ${palette.rule}` }}>
                    <td className="px-3 py-2">{p.name}</td>
                    <td className="px-3 py-2 text-right" style={{ color: palette.inkSoft }}>{activeRounds}/5</td>
                    <td className="px-3 py-2 text-right">{fmt$(due)}</td>
                    <td className="px-3 py-2 text-right">
                      <NumberInput
                        value={pay.paid ?? 0}
                        onChange={(v) => updatePayment(p.id, { paid: Number(v) || 0 })}
                        min={0}
                        step={5}
                      />
                    </td>
                    <td
                      className="px-3 py-2 text-right"
                      style={{ color: bal === 0 ? palette.green : bal > 0 ? palette.green : palette.alert, fontWeight: 600 }}
                    >
                      {fmt$(bal)}
                    </td>
                    <td className="px-3 py-2">
                      <select
                        value={pay.method || ""}
                        onChange={(e) => updatePayment(p.id, { method: e.target.value })}
                        className="px-2 py-1 text-sm w-full"
                        style={{ border: `1px solid ${palette.rule}`, borderRadius: 2 }}
                      >
                        <option value="">—</option>
                        <option value="Cash">Cash</option>
                        <option value="Zelle">Zelle</option>
                        <option value="Venmo">Venmo</option>
                        <option value="Wire">Wire</option>
                        <option value="Check">Check</option>
                        <option value="Other">Other</option>
                      </select>
                    </td>
                    <td className="px-3 py-2">
                      <input
                        type="date"
                        value={pay.date || ""}
                        onChange={(e) => updatePayment(p.id, { date: e.target.value })}
                        className="px-2 py-1 text-sm w-full"
                        style={{ border: `1px solid ${palette.rule}`, borderRadius: 2 }}
                      />
                    </td>
                    <td className="px-3 py-2">
                      <TextInput
                        value={pay.notes || ""}
                        onChange={(v) => updatePayment(p.id, { notes: v })}
                      />
                    </td>
                    <td className="px-3 py-2 text-center">
                      <Pill tone={tone}>{status}</Pill>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>

      <Card title="Per-round contributions" dense>
        <div className="text-xs px-3 py-2" style={{ color: palette.inkSoft }}>
          For players who pay round-by-round instead of (or in addition to) the trip buy-in.
          Toggle the box for each round once that player has handed over their stake.
          Amount per player per round depends on which side games they're entered in.
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm" style={{ fontVariantNumeric: "tabular-nums" }}>
            <thead>
              <tr style={{ background: "#F7F5F0", borderBottom: `1px solid ${palette.rule}` }}>
                <th className="text-left px-3 py-2 font-medium">Player</th>
                {state.rounds.map((r) => (
                  <th
                    key={r.id}
                    className="px-2 py-2 font-medium text-center"
                    style={{ minWidth: 90 }}
                  >
                    R{r.number}
                    <div className="text-xs font-normal" style={{ color: palette.inkSoft }}>
                      {r.courseName.split(" ").slice(0, 2).join(" ")}
                    </div>
                  </th>
                ))}
                <th className="text-right px-3 py-2 font-medium" style={{ width: 100 }}>Owed</th>
                <th className="text-right px-3 py-2 font-medium" style={{ width: 100 }}>Paid</th>
                <th className="text-right px-3 py-2 font-medium" style={{ width: 100 }}>Bal</th>
              </tr>
            </thead>
            <tbody>
              {state.players.map((p) => {
                let owed = 0;
                let paid = 0;
                state.rounds.forEach((r) => {
                  const exp = expectedRoundContrib(r, p.id);
                  owed += exp;
                  if (r.participants[p.id]?.paid) paid += exp;
                });
                const bal = owed - paid;
                return (
                  <tr key={p.id} style={{ borderBottom: `1px solid ${palette.rule}` }}>
                    <td className="px-3 py-2">{p.name}</td>
                    {state.rounds.map((r) => {
                      const part = r.participants[p.id] || {};
                      const exp = expectedRoundContrib(r, p.id);
                      return (
                        <td key={r.id} className="px-2 py-1 text-center">
                          {!part.active ? (
                            <span style={{ color: palette.inkSoft }}>—</span>
                          ) : (
                            <label className="inline-flex items-center gap-1 text-xs">
                              <input
                                type="checkbox"
                                checked={!!part.paid}
                                onChange={(e) => updateRoundPaid(r.id, p.id, e.target.checked)}
                                disabled={r.locked}
                              />
                              <span style={{ color: palette.inkSoft }}>{fmt$(exp)}</span>
                            </label>
                          )}
                        </td>
                      );
                    })}
                    <td className="px-3 py-2 text-right">{fmt$(owed)}</td>
                    <td className="px-3 py-2 text-right">{fmt$(paid)}</td>
                    <td
                      className="px-3 py-2 text-right"
                      style={{
                        color: bal === 0 ? palette.green : palette.alert,
                        fontWeight: 600,
                      }}
                    >
                      {fmt$(bal)}
                    </td>
                  </tr>
                );
              })}
              <tr style={{ background: "#FAFAF7", fontWeight: 600 }}>
                <td className="px-3 py-2">Round totals</td>
                {state.rounds.map((r) => (
                  <td key={r.id} className="px-2 py-2 text-center text-xs">
                    {fmt$(roundPaidTotal(r))} / {fmt$(roundExpectedTotal(r))}
                  </td>
                ))}
                <td colSpan={3}></td>
              </tr>
            </tbody>
          </table>
        </div>
      </Card>

      <Card title="Final settlement — buy-in vs. winnings">
        <div className="text-xs px-3 py-2" style={{ color: palette.inkSoft }}>
          Combines trip-level buy-in plus cumulative side-game results.
          Positive Final = you owe the player at end of trip; negative = player owes Fernando.
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm" style={{ fontVariantNumeric: "tabular-nums" }}>
            <thead>
              <tr style={{ background: "#F7F5F0", borderBottom: `1px solid ${palette.rule}` }}>
                <th className="text-left px-3 py-2 font-medium">Player</th>
                <th className="text-right px-3 py-2 font-medium">Buy-in paid</th>
                <th className="text-right px-3 py-2 font-medium">Side-game net</th>
                <th className="text-right px-3 py-2 font-medium">Final</th>
              </tr>
            </thead>
            <tbody>
              {state.players.map((p) => {
                const pay = tripBuyIn.payments?.[p.id] || {};
                const paidIn = Number(pay.paid || 0);
                const sg = cumulativeNet[p.id] || 0;
                const final = paidIn + sg;
                return (
                  <tr key={p.id} style={{ borderBottom: `1px solid ${palette.rule}` }}>
                    <td className="px-3 py-2">{p.name}</td>
                    <td className="px-3 py-2 text-right">{fmt$(paidIn)}</td>
                    <td
                      className="px-3 py-2 text-right"
                      style={{ color: sg > 0 ? palette.green : sg < 0 ? palette.alert : palette.inkSoft }}
                    >
                      {fmt$(sg)}
                    </td>
                    <td
                      className="px-3 py-2 text-right"
                      style={{ color: final > 0 ? palette.green : final < 0 ? palette.alert : palette.ink, fontWeight: 600 }}
                    >
                      {fmt$(final)}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

/* ===================== Root ===================== */

export default function App() {
  const audit = useMemo(() => getAuditConfig(), []);
  const [rawState, rawSetState] = useState(() => makeSeed());
  const [auditMeta, setAuditMeta] = useState({ loaded: false, error: null, fetchedAt: null });
  const [tab, setTab] = useState("Setup");
  const [currentRoundId, setCurrentRoundId] = useState(rawState.rounds[0]?.id);

  // In audit mode, ALL writes from child components become no-ops. The fetch()
  // effect below still uses rawSetState directly to actually populate the state.
  // Visitors cannot mutate anything from the UI.
  const state = rawState;
  const setState = audit.auditMode ? () => {} : rawSetState;

  // On audit-mode boot, fetch the published state.json from the same folder
  // and replace the seed. Banner reflects status (loading / loaded / error).
  useEffect(() => {
    if (!audit.auditMode) return;
    let cancelled = false;
    const load = async () => {
      try {
        // Cache-bust so refreshes always see the latest publish.
        const url = audit.statePath + (audit.statePath.includes("?") ? "&" : "?") + "_=" + Date.now();
        const resp = await fetch(url, { cache: "no-store" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const data = await resp.json();
        if (!data.tournament || !Array.isArray(data.players) || !Array.isArray(data.rounds)) {
          throw new Error("Invalid tournament file");
        }
        if (cancelled) return;
        const migrated = migrateState(data);
        rawSetState(migrated);
        setCurrentRoundId(migrated.rounds[0]?.id);
        // Default landing tab for audit mode = Results (most interesting)
        setTab("Results");
        setAuditMeta({ loaded: true, error: null, fetchedAt: new Date() });
      } catch (e) {
        if (!cancelled) setAuditMeta({ loaded: false, error: e.message, fetchedAt: null });
      }
    };
    load();
    return () => { cancelled = true; };
  }, [audit.auditMode, audit.statePath]);

  // Tabs available depend on mode. In audit mode hide Setup, Payments, Data —
  // visitors only see public-facing views.
  const visibleTabs = audit.auditMode
    ? ["Round", "Results", "Ledger"]
    : ["Setup", "Round", "Results", "Ledger", "Payments", "Data"];

  // If the user navigated to a hidden tab via audit-mode swap, snap to Results.
  useEffect(() => {
    if (audit.auditMode && !visibleTabs.includes(tab)) setTab("Results");
  }, [audit.auditMode, tab]);

  return (
    <div
      className="min-h-screen"
      style={{
        background: palette.bg,
        color: palette.ink,
        fontFamily: "ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif",
      }}
    >
      <header
        className="px-4 py-4 md:px-8"
        style={{ borderBottom: `1px solid ${palette.rule}`, background: palette.panel }}
      >
        <div className="flex flex-wrap items-center gap-3">
          <div>
            <div
              className="text-[10px] uppercase tracking-[0.3em]"
              style={{ color: palette.gold, fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace" }}
            >
              Champs · Payout Manager{audit.auditMode ? " · View only" : ""}
            </div>
            <h1
              className="text-xl md:text-2xl font-medium leading-tight"
              style={{ color: palette.greenDeep, letterSpacing: "-0.01em" }}
            >
              {state.tournament.name}
            </h1>
          </div>
          <div className="flex-1" />
          <nav className="flex flex-wrap gap-1">
            {visibleTabs.map((t) => (
              <button
                key={t}
                onClick={() => setTab(t)}
                className="px-3 py-2 text-sm transition"
                style={{
                  background: tab === t ? palette.greenDeep : "transparent",
                  color: tab === t ? "#fff" : palette.ink,
                  border: `1px solid ${tab === t ? palette.greenDeep : palette.rule}`,
                  borderRadius: 2,
                  letterSpacing: "0.02em",
                }}
              >
                {t}
              </button>
            ))}
          </nav>
        </div>
        {audit.auditMode && (
          <div
            className="mt-3 px-3 py-2 text-xs flex flex-wrap items-center gap-2"
            style={{
              background: auditMeta.error ? "#FCE9E5" : auditMeta.loaded ? "#E8F0EA" : "#F5EFD7",
              border: `1px solid ${auditMeta.error ? palette.alert : auditMeta.loaded ? palette.green : palette.gold}`,
              borderRadius: 2,
              color: palette.ink,
            }}
          >
            <span
              className="inline-block w-2 h-2 rounded-full"
              style={{
                background: auditMeta.error ? palette.alert : auditMeta.loaded ? palette.green : palette.gold,
              }}
            />
            {auditMeta.error ? (
              <span>
                <strong>Error loading data:</strong> {auditMeta.error}. Showing default seed.
              </span>
            ) : auditMeta.loaded ? (
              <span>
                <strong>Live data</strong> · last fetched{" "}
                {auditMeta.fetchedAt
                  ? auditMeta.fetchedAt.toLocaleString()
                  : "—"}{" "}
                · view-only mode (no edits saved)
              </span>
            ) : (
              <span>Loading published tournament data…</span>
            )}
            <div className="flex-1" />
            <button
              onClick={() => window.location.reload()}
              className="px-2 py-1 text-xs"
              style={{
                border: `1px solid ${palette.rule}`,
                background: "#fff",
                borderRadius: 2,
                cursor: "pointer",
              }}
            >
              ↻ Refresh
            </button>
          </div>
        )}
      </header>

      <main className="px-4 py-4 md:px-8 md:py-6 max-w-[1400px] mx-auto">
        {tab === "Setup" && !audit.auditMode && <SetupTab state={state} setState={setState} />}
        {tab === "Round" && (
          <RoundTab
            state={state}
            setState={setState}
            currentRoundId={currentRoundId}
            setCurrentRoundId={setCurrentRoundId}
          />
        )}
        {tab === "Results" && (
          <ResultsTab
            state={state}
            currentRoundId={currentRoundId}
            setCurrentRoundId={setCurrentRoundId}
          />
        )}
        {tab === "Ledger" && <LedgerTab state={state} />}
        {tab === "Payments" && !audit.auditMode && <PaymentsTab state={state} setState={setState} />}
        {tab === "Data" && !audit.auditMode && <DataTab state={state} setState={setState} />}
      </main>

      <footer
        className="px-4 py-3 md:px-8 text-xs"
        style={{ color: palette.inkSoft, borderTop: `1px solid ${palette.rule}` }}
      >
        {audit.auditMode
          ? "Public view · scoring lives in Golf Pad Events · this site reflects the latest published snapshot."
          : "Companion admin tool — scoring still flows through Golf Pad Events. Snapshot to JSON before closing."}
      </footer>
    </div>
  );
}

  </script>
</body>
</html>
