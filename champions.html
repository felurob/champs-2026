import React, { useState, useMemo, useRef, useEffect } from "react";

/* =====================================================================
   CHAMPS — PAYOUT MANAGER
   Companion admin tool for a 5-round golf trip. Golf Pad Events handles
   live scoring/leaderboard; this app handles roster, teams, side-game
   payouts, ledger, and exportable summaries.
   ===================================================================== */

/* ---------- Pure logic: handicap + scoring helpers ---------- */

const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

// Auto-assign category from HANDICAP INDEX. A: ≤12 (incl. plus). B: ≥13.
const categoryFromIndex = (h) => (Number(h) <= 12 ? "A" : "B");
// Back-compat alias (older code paths and JSON imports may reference this)
const categoryFromHandicap = categoryFromIndex;

// WHS-style course handicap from index, slope, course rating, and par.
//   CH = round( index × slope / 113 ) + ( courseRating − par )
// Falls back gracefully when slope / rating not provided (treats as neutral).
function courseHandicap(index, slopeRating, courseRating, coursePar) {
  const idx = Number(index);
  if (!isFinite(idx)) return 0;
  const slope = Number(slopeRating) > 0 ? Number(slopeRating) : 113;
  const base = Math.round((idx * slope) / 113);
  const cr = Number(courseRating);
  const par = Number(coursePar);
  if (!isFinite(cr) || !isFinite(par)) return base;
  return base + Math.round(cr - par);
}

const sumPars = (pars) => (Array.isArray(pars) ? pars.reduce((a, b) => a + (Number(b) || 0), 0) : 0);

// Pick the tee a player is using on this round, based on their category.
// Falls back to round-level slopeRating/courseRating, then to neutral defaults.
function teeForPlayer(round, category) {
  const t = round.teesByCategory?.[category];
  if (t && (t.slopeRating != null || t.courseRating != null)) return t;
  return {
    name: "",
    slopeRating: round.slopeRating ?? 113,
    courseRating: round.courseRating ?? null,
  };
}

// Per-round flight resolution. Golf Pad re-flights each day depending on who
// shows up, so each round can override a player's static category. Falls back
// to player.category if no per-round override is set.
function flightForRound(round, player) {
  const f = round?.participants?.[player?.id]?.flight;
  if (f === "A" || f === "B") return f;
  return player?.category;
}

// Convenience: full course-handicap calc for a player on a given round.
// Resolves the player's flight for THIS round (not their static category) so
// the correct tee is picked.
function chForPlayer(player, round) {
  const tee = teeForPlayer(round, flightForRound(round, player));
  return courseHandicap(
    player?.handicapIndex,
    tee.slopeRating,
    tee.courseRating,
    sumPars(round.pars)
  );
}

// 75% rule for skins handicap, capped at ±18. Input is a COURSE handicap.
const skinsHcp = (h) => clamp(Math.round(0.75 * Number(h)), -18, 18);

// Strokes received on a hole given a handicap and the hole's stroke index (1–18).
function strokesOnHole(hcp, holeStrokeIndex) {
  const SI = holeStrokeIndex;
  if (hcp >= 0) {
    const base = Math.floor(hcp / 18);
    const extra = hcp % 18;
    return base + (SI <= extra ? 1 : 0);
  } else {
    const give = -hcp;
    const base = -Math.floor(give / 18);
    const extra = give % 18;
    return base + (SI >= 19 - extra ? -1 : 0);
  }
}

// Net per hole using a specified handicap (full course hcp for IN/BB, skins hcp for skins).
const netOnHole = (gross, hcp, SI) => gross - strokesOnHole(hcp, SI);

// USGA count-back tie-break: returns a tuple [last9, last6, last3, hole18] where
// lower is better, evaluated lexicographically. Each value is the player's gross
// score on that segment minus a proportional handicap allocation
//   last 9 → 1/2 × CH; last 6 → 1/3 × CH; last 3 → 1/6 × CH; hole 18 → 1/18 × CH.
// (USGA Handicap System "Method of Reducing Ties".)
function countBackTuple(scoresArr, courseHcp) {
  const grossRange = (from /* 1-indexed */) => {
    let s = 0;
    for (let i = from - 1; i < 18; i++) s += Number(scoresArr[i]) || 0;
    return s;
  };
  const ch = Number(courseHcp) || 0;
  return [
    grossRange(10) - ch * (9 / 18),
    grossRange(13) - ch * (6 / 18),
    grossRange(16) - ch * (3 / 18),
    (Number(scoresArr[17]) || 0) - ch * (1 / 18),
  ];
}

// Compare two tuples lexicographically (lower wins).
function compareTuples(a, b) {
  for (let i = 0; i < a.length; i++) {
    const d = a[i] - b[i];
    if (Math.abs(d) > 1e-9) return d;
  }
  return 0;
}

const allScored = (scoresArr) =>
  Array.isArray(scoresArr) &&
  scoresArr.length === 18 &&
  scoresArr.every((s) => s !== null && s !== undefined && s !== "");

const sumGross = (scoresArr) => scoresArr.reduce((a, b) => a + (Number(b) || 0), 0);

const fmt$ = (n) => {
  const num = n == null || isNaN(n) ? 0 : Number(n);
  const isInt = num === Math.floor(num);
  return num.toLocaleString("en-US", {
    style: "currency",
    currency: "USD",
    minimumFractionDigits: isInt ? 0 : 2,
    maximumFractionDigits: isInt ? 0 : 2,
  });
};

// Round down to whole dollars. Used for all payout calculations — leftover
// fractions automatically accumulate to the house.
const dollarFloor = (n) => Math.floor(Number(n) || 0);

/* ---------- Skins engine (per category) ---------- */

function computeSkinsForCategory(catPlayers, round) {
  const pot = catPlayers.length * 18;
  if (catPlayers.length === 0) {
    return { players: [], pot: 0, holes: [], skinsByPlayer: {}, totalAwarded: 0, skinValue: 0, payouts: {} };
  }

  // Net per hole per player (uses 75%-of-COURSE-handicap)
  const net = {};
  for (const p of catPlayers) {
    const sH = skinsHcp(p.courseHcp);
    const scores = round.scores[p.id] || [];
    net[p.id] = round.holeIndexes.map((SI, i) =>
      scores[i] === "" || scores[i] == null ? null : netOnHole(Number(scores[i]), sH, SI)
    );
  }

  let carryover = 0;
  const holes = []; // { hole, value, winnerId, status: 'won'|'tied-carry'|'no-data' }
  const skinsByPlayer = Object.fromEntries(catPlayers.map((p) => [p.id, 0]));

  for (let h = 0; h < 18; h++) {
    let lowest = null;
    let winnerId = null;
    let tied = false;
    let anyData = false;

    for (const p of catPlayers) {
      const v = net[p.id][h];
      if (v == null) continue;
      anyData = true;
      if (lowest == null || v < lowest) {
        lowest = v;
        winnerId = p.id;
        tied = false;
      } else if (v === lowest) {
        tied = true;
      }
    }

    const value = 1 + carryover;
    if (!anyData) {
      holes.push({ hole: h + 1, value, winnerId: null, status: "no-data" });
      carryover = value;
    } else if (tied) {
      holes.push({ hole: h + 1, value, winnerId: null, status: "tied-carry" });
      carryover = value;
    } else {
      holes.push({ hole: h + 1, value, winnerId, status: "won" });
      skinsByPlayer[winnerId] += value;
      carryover = 0;
    }
  }

  const totalAwarded = Object.values(skinsByPlayer).reduce((a, b) => a + b, 0);
  // Per-skin value floored to whole dollars; remainder of the pot flows to the house.
  const skinValueFloat = totalAwarded > 0 ? pot / totalAwarded : 0;
  const skinValue = dollarFloor(skinValueFloat);
  const payouts = {};
  for (const p of catPlayers) payouts[p.id] = skinsByPlayer[p.id] * skinValue;

  // Edge case: no skins awarded → return pot equally (still in whole dollars)
  if (totalAwarded === 0 && catPlayers.length > 0) {
    const each = dollarFloor(pot / catPlayers.length);
    for (const p of catPlayers) payouts[p.id] = each;
  }

  const allocated = Object.values(payouts).reduce((a, b) => a + b, 0);
  const houseLeftover = pot - allocated;

  return {
    players: catPlayers.map((p) => p.id),
    pot,
    holes,
    skinsByPlayer,
    totalAwarded,
    skinValue,
    payouts,
    houseLeftover,
  };
}

/* ---------- Individual net engine ---------- */

function computeIndividualNet(eligible, round) {
  const N = eligible.length;
  const pot = N * 5;
  if (N === 0) return { eligibleIds: [], pot: 0, ranking: [], payouts: {}, positions: {} };

  const ranking = eligible
    .map((p) => {
      const scores = round.scores[p.id] || [];
      if (!allScored(scores)) return null;
      const gross = sumGross(scores);
      return {
        playerId: p.id,
        gross,
        net: gross - Number(p.courseHcp),
        scores,
        courseHcp: Number(p.courseHcp),
        countBack: countBackTuple(scores, Number(p.courseHcp)),
      };
    })
    .filter(Boolean);

  // Sort: primary by net (low wins), then USGA count-back.
  ranking.sort((a, b) => {
    if (a.net !== b.net) return a.net - b.net;
    return compareTuples(a.countBack, b.countBack);
  });

  // Sequential position assignment — count-back resolves ties.
  ranking.forEach((r, i) => {
    r.position = i + 1;
  });

  // Position payouts — all whole dollars; any leftover flows to the house.
  let pay = { 1: 0, 2: 0, 3: 0 };
  if (N === 1) pay[1] = pot;
  else if (N === 2) {
    pay[1] = dollarFloor(0.65 * pot);
    pay[2] = dollarFloor(0.35 * pot);
  } else {
    pay[3] = 5;
    const rem = pot - 5;
    pay[1] = dollarFloor(0.65 * rem);
    pay[2] = dollarFloor(0.35 * rem);
  }

  const payouts = Object.fromEntries(eligible.map((p) => [p.id, 0]));
  for (const r of ranking) {
    payouts[r.playerId] = pay[r.position] || 0;
  }

  const allocated = Object.values(payouts).reduce((a, b) => a + b, 0);
  const houseLeftover = pot - allocated;

  return { eligibleIds: eligible.map((p) => p.id), pot, ranking, payouts, positions: pay, houseLeftover };
}

/* ---------- Best ball engine ---------- */

function computeBestBallForFlight(playersAll, round, flight) {
  // Eligible = active + inBestBall + in this flight
  const eligibleIds = new Set(
    playersAll
      .filter(
        (p) =>
          flightForRound(round, p) === flight &&
          round.participants[p.id]?.active &&
          round.participants[p.id]?.inBestBall
      )
      .map((p) => p.id)
  );
  if (eligibleIds.size === 0)
    return {
      flight,
      eligibleIds: [],
      pot: 0,
      teamResults: [],
      teamPayouts: {},
      playerPayouts: {},
      positions: {},
    };

  const pot = eligibleIds.size * 5;

  // Only teams labeled for this flight (or, if unlabeled, with all members in this flight).
  const flightTeams = round.teams.filter((t) => {
    if (t.flight) return t.flight === flight;
    // Legacy team without flight tag: derive from members' per-round flights
    const cats = t.playerIds
      .map((pid) => {
        const p = playersAll.find((pp) => pp.id === pid);
        return p ? flightForRound(round, p) : null;
      })
      .filter(Boolean);
    return cats.length > 0 && cats.every((c) => c === flight);
  });

  const teamResults = [];
  for (const team of flightTeams) {
    const members = team.playerIds.filter((pid) => eligibleIds.has(pid));
    if (members.length === 0) continue;
    const perHole = []; // team's best net per hole
    let valid = true;
    for (let h = 0; h < 18; h++) {
      let bestNet = null;
      for (const pid of members) {
        const player = playersAll.find((pp) => pp.id === pid);
        const g = (round.scores[pid] || [])[h];
        if (g === "" || g == null) continue;
        const n = netOnHole(Number(g), Number(player.courseHcp), round.holeIndexes[h]);
        if (bestNet == null || n < bestNet) bestNet = n;
      }
      if (bestNet == null) {
        valid = false;
        break;
      }
      perHole.push(bestNet);
    }
    const teamTotal = valid ? perHole.reduce((a, b) => a + b, 0) : null;
    // Count-back tuple from per-hole net. No further handicap allocation needed —
    // perHole values are already net.
    const cbTuple = valid
      ? [
          perHole.slice(9, 18).reduce((a, b) => a + b, 0),
          perHole.slice(12, 18).reduce((a, b) => a + b, 0),
          perHole.slice(15, 18).reduce((a, b) => a + b, 0),
          perHole[17],
        ]
      : null;
    teamResults.push({
      teamId: team.id,
      teamName: team.name,
      members,
      total: teamTotal,
      countBack: cbTuple,
    });
  }

  const ranked = teamResults
    .filter((t) => t.total != null)
    .sort((a, b) => {
      if (a.total !== b.total) return a.total - b.total;
      return compareTuples(a.countBack || [0, 0, 0, 0], b.countBack || [0, 0, 0, 0]);
    });

  // Sequential positions — count-back resolves any total-net ties.
  ranked.forEach((r, i) => {
    r.position = i + 1;
  });

  let pay = { 1: 0, 2: 0 };
  if (ranked.length === 1) pay[1] = pot;
  else if (ranked.length >= 2) {
    pay[1] = dollarFloor(0.65 * pot);
    pay[2] = dollarFloor(0.35 * pot);
  }

  const teamPayouts = {};
  const playerPayouts = {};
  for (const id of eligibleIds) playerPayouts[id] = 0;

  // Track house leftover from both the position split AND the team-internal split.
  let houseLeftover = pot - ((pay[1] || 0) + (pay[2] || 0));

  for (const t of ranked) {
    const eachTeam = pay[t.position] || 0;
    teamPayouts[t.teamId] = eachTeam;
    if (t.members.length > 0 && eachTeam > 0) {
      const perMember = dollarFloor(eachTeam / t.members.length);
      for (const pid of t.members) playerPayouts[pid] += perMember;
      houseLeftover += eachTeam - perMember * t.members.length;
    }
  }

  return {
    flight,
    eligibleIds: Array.from(eligibleIds),
    pot,
    teamResults: ranked.concat(teamResults.filter((t) => t.total == null)),
    teamPayouts,
    playerPayouts,
    positions: pay,
    houseLeftover,
  };
}

// Legacy/compat: combined view across both flights.
function computeBestBall(playersAll, round) {
  const a = computeBestBallForFlight(playersAll, round, "A");
  const b = computeBestBallForFlight(playersAll, round, "B");
  const playerPayouts = { ...a.playerPayouts, ...b.playerPayouts };
  return {
    A: a,
    B: b,
    pot: a.pot + b.pot,
    teamResults: [...a.teamResults, ...b.teamResults],
    teamPayouts: { ...a.teamPayouts, ...b.teamPayouts },
    playerPayouts,
    positions: { A: a.positions, B: b.positions },
    eligibleIds: [...a.eligibleIds, ...b.eligibleIds],
    houseLeftover: a.houseLeftover + b.houseLeftover,
  };
}

/* ---------- Round-level aggregator ---------- */

function computeRoundResults(round, players) {
  // Augment every player with their COURSE handicap and EFFECTIVE FLIGHT
  // for this specific round (per-round flight override falls back to static
  // category if no override is set).
  const playersCH = players.map((p) => ({
    ...p,
    flight: flightForRound(round, p),
    courseHcp: chForPlayer(p, round),
  }));

  const activePlayers = playersCH.filter((p) => round.participants[p.id]?.active);
  const inSkins = (cat) =>
    activePlayers.filter(
      (p) => round.participants[p.id]?.inSkins && p.flight === cat
    );
  const inIN = (cat) =>
    activePlayers.filter(
      (p) => round.participants[p.id]?.inIndividualNet && p.flight === cat
    );

  const skinsA = computeSkinsForCategory(inSkins("A"), round);
  const skinsB = computeSkinsForCategory(inSkins("B"), round);
  const indNetA = computeIndividualNet(inIN("A"), round);
  const indNetB = computeIndividualNet(inIN("B"), round);
  // Combined view for backward-compatibility with downstream code that just
  // wants per-player IN payouts:
  const indNet = {
    eligibleIds: [...indNetA.eligibleIds, ...indNetB.eligibleIds],
    pot: indNetA.pot + indNetB.pot,
    ranking: [...indNetA.ranking, ...indNetB.ranking],
    payouts: { ...indNetA.payouts, ...indNetB.payouts },
    positions: { A: indNetA.positions, B: indNetB.positions },
  };
  const bb = computeBestBall(playersCH, round);

  // House total = $2/active-player admin fee + every rounding leftover from each
  // game (Skins per-flight, IN per-flight, Best Ball per-flight including the
  // team-internal split). Hidden from public displays.
  const houseAmount =
    activePlayers.length * 2 +
    (skinsA.houseLeftover || 0) +
    (skinsB.houseLeftover || 0) +
    (indNetA.houseLeftover || 0) +
    (indNetB.houseLeftover || 0) +
    (bb.houseLeftover || 0);

  // Per-player payout ledger for this round.
  // contrib = total cash the player puts in for this round if they're entered
  // in all three side games: $20 skins + $5 individual net + $5 best ball = $30.
  // (The skins entry of $20 includes a $2 admin/house slice — kept silent in
  // public-facing summaries; not labeled.)
  const ledger = {};
  for (const p of playersCH) {
    const part = round.participants[p.id] || {};
    if (!part.active) continue;
    const contrib =
      (part.inSkins ? 20 : 0) +
      (part.inIndividualNet ? 5 : 0) +
      (part.inBestBall ? 5 : 0);
    const winSkins =
      (skinsA.payouts[p.id] || 0) + (skinsB.payouts[p.id] || 0);
    const winIN = indNet.payouts[p.id] || 0;
    const winBB = bb.playerPayouts[p.id] || 0;
    const won = winSkins + winIN + winBB;
    ledger[p.id] = {
      contrib,
      winSkins,
      winIN,
      winBB,
      won,
      net: won - contrib,
      courseHcp: p.courseHcp,
    };
  }

  return {
    activePlayerIds: activePlayers.map((p) => p.id),
    coursePar: sumPars(round.pars),
    courseHcps: Object.fromEntries(playersCH.map((p) => [p.id, p.courseHcp])),
    potBreakdown: {
      skinsA: skinsA.pot,
      skinsB: skinsB.pot,
      individualNet: indNet.pot,
      bestBall: bb.pot,
      house: houseAmount,
      total: skinsA.pot + skinsB.pot + indNet.pot + bb.pot + houseAmount,
    },
    skinsA,
    skinsB,
    indNet,
    indNetA,
    indNetB,
    bestBall: bb,
    bestBallA: bb.A,
    bestBallB: bb.B,
    houseAmount,
    ledger,
  };
}

/* ---------- Validation ---------- */

function validateRound(round, players) {
  const warnings = [];
  for (const cat of ["A", "B"]) {
    const t = round.teesByCategory?.[cat];
    if (!t || !t.slopeRating) {
      warnings.push(`Flight ${cat}: slope rating not set — course handicaps will use neutral 113.`);
    }
    if (!t || t.courseRating == null || t.courseRating === "") {
      warnings.push(`Flight ${cat}: course rating not set — will skip the (rating − par) adjustment.`);
    }
  }
  for (const p of players) {
    const part = round.participants[p.id];
    if (part?.active && !flightForRound(round, p)) {
      warnings.push(`${p.name} is active but has no flight assigned for this round.`);
    }
    if (part?.active) {
      const sc = round.scores[p.id] || [];
      const filled = sc.filter((s) => s !== "" && s != null).length;
      if (filled > 0 && filled < 18) {
        warnings.push(`${p.name}: scores incomplete (${filled}/18).`);
      }
    }
  }
  // Best-ball team coverage and shape
  const bbPlayers = players.filter(
    (p) => round.participants[p.id]?.active && round.participants[p.id]?.inBestBall
  );
  const inTeam = new Set();
  for (const t of round.teams) for (const pid of t.playerIds) inTeam.add(pid);
  for (const p of bbPlayers) {
    if (!inTeam.has(p.id))
      warnings.push(`${p.name} is in best ball but not on any team.`);
  }
  for (const t of round.teams) {
    if (t.playerIds.length !== 2) {
      warnings.push(`${t.name}: should have exactly 2 players (currently ${t.playerIds.length}).`);
    }
    // Use round-aware flight (per-round overrides may apply).
    const cats = new Set(
      t.playerIds
        .map((pid) => {
          const pl = players.find((p) => p.id === pid);
          return pl ? flightForRound(round, pl) : null;
        })
        .filter(Boolean)
    );
    if (cats.size > 1) {
      warnings.push(`${t.name}: mixes Flight A and Flight B players. Best-ball teams must be same flight.`);
    }
    if (t.flight && cats.size === 1 && !cats.has(t.flight)) {
      warnings.push(`${t.name}: tagged Flight ${t.flight} but contains Flight ${[...cats][0]} player(s).`);
    }
  }
  return warnings;
}

/* ---------- JSON migration (reusable) ---------- */

// Normalize a tournament state from any of our older JSON shapes into the
// current schema. Used both by Data → Import JSON and by audit-mode auto-load.
function migrateState(data) {
  const fallbackTee = (r) => ({
    name: "",
    slopeRating: r.slopeRating ?? 113,
    courseRating: r.courseRating ?? null,
  });
  return {
    ...data,
    tripBuyIn: data.tripBuyIn ?? {
      payments: Object.fromEntries(
        data.players.map((p) => [p.id, { paid: 0, method: "", date: "", notes: "" }])
      ),
    },
    players: data.players.map((p) => ({
      ...p,
      handicapIndex: p.handicapIndex ?? p.handicap ?? 0,
    })),
    rounds: data.rounds.map((r) => ({
      ...r,
      teeTime: r.teeTime ?? "",
      teesByCategory: r.teesByCategory ?? { A: fallbackTee(r), B: fallbackTee(r) },
      participants: Object.fromEntries(
        Object.entries(r.participants || {}).map(([pid, part]) => [
          pid,
          { paid: false, ...part },
        ])
      ),
      teams: (r.teams || []).map((t) => {
        if (t.flight) return t;
        const cats = (t.playerIds || [])
          .map((pid) => data.players.find((p) => p.id === pid)?.category)
          .filter(Boolean);
        const flight =
          cats.length === 0 ? "A" : cats.every((c) => c === "B") ? "B" : "A";
        return { ...t, flight };
      }),
    })),
  };
}

/* ---------- Audit-mode detection ----------
   The app supports an "audit" mode for read-only public hosting:
   - URL contains ?audit=1 OR ?state=<path-to-json>
   - Loads state.json (or the path given) from the same folder via fetch()
   - Hides Setup / Data / edit buttons; shows a banner with last-update time

   For the desktop "working" copy, just open the HTML normally — no ?audit
   parameter, and everything is editable as usual.
*/
function getAuditConfig() {
  if (typeof window === "undefined") return { auditMode: false };
  const params = new URLSearchParams(window.location.search);
  const stateParam = params.get("state");
  const auditFlag = params.get("audit") === "1";
  if (stateParam) return { auditMode: true, statePath: stateParam };
  if (auditFlag) return { auditMode: true, statePath: "state.json" };
  return { auditMode: false };
}

function SetupTab({ state, setState }) {
  const indexFileRef = useRef(null);

  const updateName = (v) =>
    setState((s) => ({ ...s, tournament: { ...s.tournament, name: v } }));

  // Import handicap indexes from Golf Pad's golfer-list CSV.
  // Format: Email, FirstName, LastName, Gender, Handicap (with quotes + BOM).
  // Updates each matched player's handicapIndex.
  const importIndexes = async (file) => {
    let text = await file.text();
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
    const lines = text.split(/\r?\n/).filter((l) => l.trim());
    if (lines.length < 2) {
      alert("CSV is empty.");
      return;
    }
    const parseLine = (line) => {
      const cells = [];
      let cur = "";
      let inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
          else inQ = !inQ;
        } else if (ch === "," && !inQ) { cells.push(cur); cur = ""; }
        else cur += ch;
      }
      cells.push(cur);
      return cells.map((c) => c.trim());
    };
    const header = parseLine(lines[0]).map((h) => h.toLowerCase().replace(/\s+/g, ""));
    const colFirst = header.findIndex((h) => /^firstname$|^first$/i.test(h));
    const colLast = header.findIndex((h) => /^lastname$|^last$/i.test(h));
    const colHcp = header.findIndex((h) => /^handicap$|^index$|^hcp$/i.test(h));
    if (colFirst === -1 || colLast === -1 || colHcp === -1) {
      alert(
        `Couldn't locate FirstName, LastName, and Handicap columns. Detected: ${header.join(", ")}`
      );
      return;
    }
    // Plus handicap support: "+1.8" → -1.8 ; "-1.8" stays -1.8 ; "1.8" stays positive.
    const parseHcp = (s) => {
      const t = String(s).trim();
      if (t.startsWith("+")) return -Number(t.slice(1));
      const n = Number(t);
      return isNaN(n) ? null : n;
    };
    const updates = [];
    const unmatched = [];
    for (let i = 1; i < lines.length; i++) {
      const cells = parseLine(lines[i]);
      const fullName = `${cells[colFirst] ?? ""} ${cells[colLast] ?? ""}`.replace(/\s+/g, " ").trim();
      if (!fullName) continue;
      const hcp = parseHcp(cells[colHcp]);
      if (hcp == null) continue;
      const player = state.players.find(
        (p) => p.name.toLowerCase() === fullName.toLowerCase()
      );
      if (!player) {
        unmatched.push(fullName);
        continue;
      }
      updates.push({ id: player.id, handicapIndex: hcp });
    }
    if (updates.length === 0) {
      let msg = "No matching players found in the CSV.";
      if (unmatched.length) msg += `\nNames in CSV: ${unmatched.slice(0, 5).join(", ")}${unmatched.length > 5 ? "…" : ""}`;
      alert(msg);
      return;
    }
    if (
      !confirm(
        `Update handicap index for ${updates.length} player(s)?` +
          (unmatched.length ? `\n${unmatched.length} unmatched name(s) will be skipped.` : "")
      )
    )
      return;
    setState((s) => ({
      ...s,
      players: s.players.map((p) => {
        const u = updates.find((u) => u.id === p.id);
        if (!u) return p;
        const merged = { ...p, handicapIndex: u.handicapIndex };
        if (!merged.categoryOverride) {
          merged.category = categoryFromIndex(merged.handicapIndex);
        }
        return merged;
      }),
    }));
    let msg = `Updated handicap index for ${updates.length} player(s).`;
    if (unmatched.length) msg += `\nUnmatched (skipped): ${unmatched.join(", ")}`;
    alert(msg);
  };

  const addPlayer = () => {
    const id = "p" + (Math.max(0, ...state.players.map((p) => Number(p.id.replace("p", "")) || 0)) + 1);
    setState((s) => ({
      ...s,
      players: [
        ...s.players,
        {
          id,
          name: "New player",
          handicapIndex: 18,
          category: "B",
          categoryOverride: false,
          notes: "",
        },
      ],
      tripBuyIn: {
        ...s.tripBuyIn,
        payments: {
          ...(s.tripBuyIn?.payments || {}),
          [id]: { paid: 0, method: "", date: "", notes: "" },
        },
      },
      // also default-include in every round
      rounds: s.rounds.map((r) => ({
        ...r,
        participants: {
          ...r.participants,
          [id]: { active: true, inSkins: true, inIndividualNet: true, inBestBall: true, paid: false },
        },
      })),
    }));
  };

  const updatePlayer = (id, patch) =>
    setState((s) => ({
      ...s,
      players: s.players.map((p) => {
        if (p.id !== id) return p;
        const merged = { ...p, ...patch };
        if (
          patch.handicapIndex !== undefined &&
          !merged.categoryOverride
        ) {
          merged.category = categoryFromIndex(merged.handicapIndex);
        }
        return merged;
      }),
    }));

  const removePlayer = (id) => {
    if (!confirm("Remove this player from the tournament?")) return;
    setState((s) => {
      const newPayments = { ...(s.tripBuyIn?.payments || {}) };
      delete newPayments[id];
      return {
        ...s,
        players: s.players.filter((p) => p.id !== id),
        tripBuyIn: { ...s.tripBuyIn, payments: newPayments },
        rounds: s.rounds.map((r) => {
          const { [id]: _omit, ...rest } = r.participants;
          const newScores = { ...r.scores };
          delete newScores[id];
          const newTeams = r.teams.map((t) => ({
            ...t,
            playerIds: t.playerIds.filter((x) => x !== id),
          }));
          return { ...r, participants: rest, scores: newScores, teams: newTeams };
        }),
      };
    });
  };

  const updateRound = (rid, patch) =>
    setState((s) => ({
      ...s,
      rounds: s.rounds.map((r) => (r.id === rid ? { ...r, ...patch } : r)),
    }));

  return (
    <div className="space-y-6">
      <Card title="Tournament">
        <label className="text-xs uppercase tracking-wider" style={{ color: palette.inkSoft }}>
          Name
        </label>
        <div className="mt-1">
          <TextInput value={state.tournament.name} onChange={updateName} />
        </div>
      </Card>

      <Card
        title={`Players (${state.players.length})`}
        action={
          <div className="flex gap-2 items-center">
            <Btn
              variant="secondary"
              onClick={() => indexFileRef.current?.click()}
            >
              Import indexes (CSV)
            </Btn>
            <input
              ref={indexFileRef}
              type="file"
              accept=".csv,text/csv"
              className="hidden"
              onChange={(e) => {
                if (e.target.files?.[0]) importIndexes(e.target.files[0]);
                e.target.value = "";
              }}
            />
            <Btn onClick={addPlayer} variant="secondary">+ Add player</Btn>
          </div>
        }
        dense
      >
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr style={{ background: "#F7F5F0", borderBottom: `1px solid ${palette.rule}` }}>
                <th className="text-left px-3 py-2 font-medium" style={{ minWidth: 180 }}>

                </th>
                <th className="text-left px-3 py-2 font-medium" style={{ width: 80 }}>
                  Override
                </th>
                <th className="text-left px-3 py-2 font-medium">Notes</th>
                <th className="px-3 py-2"></th>
              </tr>
            </thead>
            <tbody>
              {state.players.map((p) => {
                const auto = categoryFromIndex(p.handicapIndex);
                return (
                  <tr key={p.id} style={{ borderBottom: `1px solid ${palette.rule}` }}>
                    <td className="px-3 py-2">
                      <TextInput value={p.name} onChange={(v) => updatePlayer(p.id, { name: v })} />
                    </td>

                      <NumberInput
                        value={p.handicapIndex}

                    <td className="px-3 py-2">
                      {p.categoryOverride ? (

/* ===================== Tabs: Round ===================== */

function RoundTab({ state, setState, currentRoundId, setCurrentRoundId }) {
  const round = state.rounds.find((r) => r.id === currentRoundId);
  const [subTab, setSubTab] = useState("Participation");
  const warnings = useMemo(
    () => (round ? validateRound(round, state.players) : []),
    [round, state.players]
  );

  if (!round) return null;

  const updateRound = (patch) =>
    setState((s) => ({
      ...s,
      rounds: s.rounds.map((r) => (r.id === round.id ? { ...r, ...patch } : r)),
    }));

  const toggleLock = () => updateRound({ locked: !round.locked });

  const subs = ["Participation", "Course", "Teams", "Scores"];

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center gap-2">
        {state.rounds.map((r) => (
          <button
            key={r.id}
            onClick={() => setCurrentRoundId(r.id)}
            className="px-3 py-2 text-sm transition"
            style={{
              background: r.id === round.id ? palette.greenDeep : "#fff",
              color: r.id === round.id ? "#fff" : palette.ink,
              border: `1px solid ${r.id === round.id ? palette.greenDeep : palette.rule}`,
              borderRadius: 2,
            }}
          >
            R{r.number}
            <span className="ml-2 text-xs opacity-70">{r.courseName}</span>
          </button>
        ))}
        <div className="flex-1" />
        <Pill tone={round.locked ? "locked" : "open"}>{round.locked ? "Locked" : "Open"}</Pill>
        <Btn variant={round.locked ? "secondary" : "danger"} onClick={toggleLock}>
          {round.locked ? "Unlock round" : "Lock round"}
        </Btn>
      </div>

      {warnings.length > 0 && (
        <div
          className="px-4 py-3 text-sm"
          style={{ background: "#FBEFE6", color: palette.alert, border: `1px solid #EBC9B0`, borderRadius: 2 }}
        >
          <div className="font-medium uppercase text-xs tracking-wider mb-1">Warnings</div>
          <ul className="list-disc pl-5">
            {warnings.map((w, i) => (
              <li key={i}>{w}</li>
            ))}
          </ul>
        </div>
      )}

      <div className="flex flex-wrap gap-1">
        {subs.map((t) => (
          <button
            key={t}
            onClick={() => setSubTab(t)}
            className="px-3 py-1.5 text-sm"
            style={{
              background: subTab === t ? palette.ink : "transparent",
              color: subTab === t ? "#fff" : palette.ink,
              border: `1px solid ${subTab === t ? palette.ink : palette.rule}`,
              borderRadius: 2,
            }}
          >
            {t}
          </button>
        ))}
      </div>

      {subTab === "Participation" && (
        <ParticipationPanel state={state} round={round} updateRound={updateRound} />
      )}
      {subTab === "Course" && <CoursePanel round={round} players={state.players} updateRound={updateRound} />}
      {subTab === "Teams" && (
        <TeamsPanel state={state} round={round} updateRound={updateRound} />
      )}
      {subTab === "Scores" && (
        <ScoresPanel state={state} round={round} updateRound={updateRound} />
      )}
    </div>
  );
}

function ParticipationPanel({ state, round, updateRound }) {
  const setPart = (pid, patch) => {
    const old = round.participants[pid] || {
      active: false,
      inSkins: false,
      inIndividualNet: false,
      inBestBall: false,
    };
    updateRound({
      participants: { ...round.participants, [pid]: { ...old, ...patch } },
    });
  };

  // Live pot preview — uses the per-round flight resolution so it reflects
  // any flight overrides Fernando set on this round (Golf Pad re-flights each
  // day depending on who's playing).
  const flightOf = (p) => flightForRound(round, p);
  const active = state.players.filter((p) => round.participants[p.id]?.active);
  const inSkinsA = active.filter(
    (p) => round.participants[p.id]?.inSkins && flightOf(p) === "A"
  );
  const inSkinsB = active.filter(
    (p) => round.participants[p.id]?.inSkins && flightOf(p) === "B"
  );
  const inIN = active.filter((p) => round.participants[p.id]?.inIndividualNet);
  const inINA = inIN.filter((p) => flightOf(p) === "A");
  const inINB = inIN.filter((p) => flightOf(p) === "B");
  const inBB = active.filter((p) => round.participants[p.id]?.inBestBall);
  const inBBA = inBB.filter((p) => flightOf(p) === "A");
  const inBBB = inBB.filter((p) => flightOf(p) === "B");

  const setAllActive = (val) =>
    updateRound({
      participants: Object.fromEntries(
        state.players.map((p) => [
          p.id,
          {
            ...(round.participants[p.id] || {
              inSkins: true,
              inIndividualNet: true,
              inBestBall: true,
            }),
            active: val,
          },
        ])
      ),
    });

  // Quick action: snap each active player's flight back to their static
  // category (handy if Fernando wants to undo a round-specific override).
  const resetAllFlights = () => {
    if (!confirm("Clear per-round flight overrides for all players in this round?")) return;
    const next = { ...round.participants };
    for (const pid of Object.keys(next)) {
      if (next[pid].flight) {
        const { flight, ...rest } = next[pid];
        next[pid] = rest;
      }
    }
    updateRound({ participants: next });
  };

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-7 gap-3">
        <KPI label="Active" value={active.length} />
        <KPI label="Skins A pot" value={fmt$(inSkinsA.length * 18)} sub={`${inSkinsA.length} pl.`} />
        <KPI label="Skins B pot" value={fmt$(inSkinsB.length * 18)} sub={`${inSkinsB.length} pl.`} />
        <KPI label="IN A pot" value={fmt$(inINA.length * 5)} sub={`${inINA.length} pl.`} />
        <KPI label="IN B pot" value={fmt$(inINB.length * 5)} sub={`${inINB.length} pl.`} />
        <KPI label="BB A pot" value={fmt$(inBBA.length * 5)} sub={`${inBBA.length} pl.`} />
        <KPI label="BB B pot" value={fmt$(inBBB.length * 5)} sub={`${inBBB.length} pl.`} />
      </div>

      <div className="flex gap-2 flex-wrap items-center">
        <Btn variant="secondary" onClick={() => setAllActive(true)} disabled={round.locked}>
          All in
        </Btn>
        <Btn variant="ghost" onClick={() => setAllActive(false)} disabled={round.locked}>
          All out
        </Btn>
        <Btn variant="ghost" onClick={resetAllFlights} disabled={round.locked}>
          Reset flights
        </Btn>
        <span className="text-xs ml-2" style={{ color: palette.inkSoft }}>
          The <strong>Flight</strong> column is the assignment for THIS round only — Golf Pad re-flights each day, so override here when needed. The default falls back to the player's static category from their index.
        </span>
      </div>

      <Card dense>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr style={{ background: "#F7F5F0", borderBottom: `1px solid ${palette.rule}` }}>
                <th className="text-left px-3 py-2 font-medium">Player</th>
                <th className="px-3 py-2 font-medium">Index</th>
                <th className="px-3 py-2 font-medium">Flight (this round)</th>
                <th className="px-3 py-2 font-medium">Active</th>
                <th className="px-3 py-2 font-medium">Skins</th>
                <th className="px-3 py-2 font-medium">Ind. Net</th>
                <th className="px-3 py-2 font-medium">Best Ball</th>
              </tr>
            </thead>
            <tbody>
              {state.players.map((p) => {
                const part = round.participants[p.id] || {};
                const effective = flightForRound(round, p);
                const isOverridden = part.flight === "A" || part.flight === "B";
                const setFlight = (val) => {
                  if (val === "" || val === p.category) {
                    // Selecting the static category clears the override entirely.
                    const { flight, ...rest } = part;
                    updateRound({
                      participants: { ...round.participants, [p.id]: rest },
                    });
                  } else {
                    setPart(p.id, { flight: val });
                  }
                };
                return (
                  <tr key={p.id} style={{ borderBottom: `1px solid ${palette.rule}` }}>
                    <td className="px-3 py-2">{p.name}</td>
                    <td className="px-3 py-2 text-center" style={{ fontFamily: "ui-monospace" }}>
                      {p.handicapIndex}
                    </td>
                    <td className="px-3 py-2 text-center">
                      <div className="flex items-center justify-center gap-1">
                        <select
                          value={effective || ""}
                          onChange={(e) => setFlight(e.target.value)}
                          disabled={round.locked || !part.active}
                          className="px-2 py-1 text-sm"
                          style={{ border: `1px solid ${palette.rule}`, borderRadius: 2, background: "#fff" }}
                        >
                          <option value="A">A</option>
                          <option value="B">B</option>
                        </select>
                        {isOverridden && effective !== p.category && (
                          <span
                            title={`Default by index = ${p.category}`}
                            className="text-xs"
                            style={{ color: palette.gold, fontWeight: 700 }}
                          >
                            ●
                          </span>
                        )}
                      </div>
                    </td>
                    <td className="px-3 py-2 text-center">
                      <Toggle
                        value={part.active}
                        onChange={(v) => setPart(p.id, { active: v })}
                        disabled={round.locked}
                      />
                    </td>
                    <td className="px-3 py-2 text-center">
                      <Toggle
                        value={part.inSkins}
                        onChange={(v) => setPart(p.id, { inSkins: v })}
                        disabled={round.locked || !part.active}
                      />
                    </td>
                    <td className="px-3 py-2 text-center">
                      <Toggle
                        value={part.inIndividualNet}
                        onChange={(v) => setPart(p.id, { inIndividualNet: v })}
                        disabled={round.locked || !part.active}
                      />
                    </td>
                    <td className="px-3 py-2 text-center">
                      <Toggle
                        value={part.inBestBall}
                        onChange={(v) => setPart(p.id, { inBestBall: v })}
                        disabled={round.locked || !part.active}
                      />
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

function TeamsPanel({ state, round, updateRound }) {
  const chOf = (p) => chForPlayer(p, round);

  const bbPlayersByFlight = (flight) =>
    state.players.filter(
      (p) =>
        flightForRound(round, p) === flight &&
        round.participants[p.id]?.active &&
        round.participants[p.id]?.inBestBall
    );

  // Migrate any team without an explicit flight: derive from members' per-round flights
  const teamFlight = (t) => {
    if (t.flight) return t.flight;
    const cats = t.playerIds
      .map((pid) => {
        const pl = state.players.find((p) => p.id === pid);
        return pl ? flightForRound(round, pl) : null;
      })
      .filter(Boolean);
    if (cats.length === 0) return "A";
    return cats.every((c) => c === "B") ? "B" : "A";
  };

  const teamsByFlight = (flight) => round.teams.filter((t) => teamFlight(t) === flight);

  const addTeam = (flight) => {
    const id = "t" + flight + "-" + Date.now().toString(36).slice(-3);
    const existing = teamsByFlight(flight).length;
    updateRound({
      teams: [
        ...round.teams,
        { id, name: `Team ${flight}${existing + 1}`, playerIds: [], flight },
      ],
    });
  };

  const updateTeam = (tid, patch) =>
    updateRound({
      teams: round.teams.map((t) => (t.id === tid ? { ...t, ...patch } : t)),
    });

  const removeTeam = (tid) => {
    if (!confirm("Remove team?")) return;
    updateRound({ teams: round.teams.filter((t) => t.id !== tid) });
  };

  const togglePlayerOnTeam = (tid, pid) => {
    // Remove from any other team in any flight first
    const cleaned = round.teams.map((t) => ({
      ...t,
      playerIds: t.id === tid ? t.playerIds : t.playerIds.filter((x) => x !== pid),
    }));
    const target = cleaned.find((t) => t.id === tid);
    const has = target.playerIds.includes(pid);
    // Cap at 2 members per team
    if (!has && target.playerIds.length >= 2) {
      alert("Best-ball teams are 2-man pairs. Remove a player first.");
      return;
    }
    const newTeams = cleaned.map((t) =>
      t.id === tid
        ? {
            ...t,
            playerIds: has ? t.playerIds.filter((x) => x !== pid) : [...t.playerIds, pid],
          }
        : t
    );
    updateRound({ teams: newTeams });
  };

  const flightSummary = (flight) => {
    const pool = bbPlayersByFlight(flight);
    const assigned = new Set(
      round.teams
        .filter((t) => teamFlight(t) === flight)
        .flatMap((t) => t.playerIds)
    );
    const unassigned = pool.filter((p) => !assigned.has(p.id));
    return { pool, unassigned, teams: teamsByFlight(flight) };
  };

  const renderFlightColumn = (flight) => {
    const { pool, unassigned, teams } = flightSummary(flight);
    const flightBbPool = pool;
    return (
      <div key={flight}>
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2">
            <Pill tone={flight}>{flight}</Pill>
            <span className="text-sm font-medium">Flight {flight}</span>

function ScoresPanel({ state, round, updateRound }) {
  const fileRef = useRef(null);
  const chOf = (p) => chForPlayer(p, round);

  const setScore = (pid, h, val) => {
    const arr = [...(round.scores[pid] || Array(18).fill(""))];
    arr[h] = val === "" ? "" : Number(val);
    updateRound({ scores: { ...round.scores, [pid]: arr } });
  };

  // CSV import: handles both the simple "Player,1,2,...,18" format AND
  // Golf Pad's "Team","Hole#1",..."Hole#18","Net" format with BOM and quoted cells.
  const importCSV = async (file) => {
    let text = await file.text();
    // Strip BOM
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
    const lines = text.split(/\r?\n/).filter((l) => l.trim());
    if (lines.length < 2) {
      alert("CSV is empty.");
      return;
    }

    // Parse a CSV line, respecting quoted cells.
    const parseLine = (line) => {
      const cells = [];
      let cur = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          cells.push(cur);
          cur = "";
        } else {
          cur += ch;
        }
      }
      cells.push(cur);
      return cells.map((c) => c.trim());
    };

    const header = parseLine(lines[0]);
    const norm = (s) => s.replace(/\s+/g, "").toLowerCase();

    // Find player name column (matches "Player", "Team", "Name", or default to first column)
    let nameCol = header.findIndex((h) => /^(player|team|name|golfer)$/i.test(h.trim()));
    if (nameCol === -1) nameCol = 0;

    // Find hole columns 1-18. Accept "1", "Hole 1", "Hole#1", "H1".
    const holeColIdxs = [];
    for (let h = 1; h <= 18; h++) {
      const idx = header.findIndex((col) => {
        const n = norm(col);
        return n === String(h) || n === `hole${h}` || n === `hole#${h}` || n === `h${h}`;
      });
      if (idx === -1) {
        alert(
          `Couldn't find a column for hole ${h}. Detected header columns:\n` +
            header.join(" | ")
        );
        return;
      }
      holeColIdxs.push(idx);
    }

    const newScores = { ...round.scores };
    let imported = 0;
    let unknown = [];
    let zeroed = 0;
    for (let i = 1; i < lines.length; i++) {
      const cells = parseLine(lines[i]);
      const name = cells[nameCol] ?? "";
      if (!name.trim()) continue;
      const player = state.players.find(
        (p) => p.name.toLowerCase() === name.toLowerCase()
      );
      if (!player) {
        unknown.push(name);
        continue;
      }
      const scores = holeColIdxs.map((cIdx) => {
        const v = cells[cIdx];
        if (v === "" || v == null) return "";
        const n = Number(v);
        return isNaN(n) ? "" : n;
      });
      // Skip rows where every score is 0 (Golf Pad pre-tournament export)
      if (scores.every((s) => s === 0)) {
        zeroed++;
        continue;
      }
      newScores[player.id] = scores;
      imported++;
    }
    updateRound({ scores: newScores });
    let msg = `Imported scores for ${imported} player(s).`;
    if (zeroed)
      msg += `\nSkipped ${zeroed} all-zero row(s) — likely a pre-tournament export. Re-export after play.`;
    if (unknown.length)
      msg += `\nUnmatched names: ${unknown.join(", ")}\nFix the spelling on the Setup tab or in the CSV, then re-import.`;
    alert(msg);
  };

  const activePlayers = state.players.filter(
    (p) => round.participants[p.id]?.active
  );

  // Compute results inline so the share buttons can sit alongside the import button.
  const inlineResults = useMemo(
    () => computeRoundResults(round, state.players),
    [round, state.players]
  );
  const hasAnyScore = Object.values(round.scores || {}).some(
    (arr) => Array.isArray(arr) && arr.some((s) => s !== "" && s != null)
  );

  return (
    <div className="space-y-4">
      <Card>
        <div className="flex flex-wrap gap-2 items-center">
          <Btn
            variant="secondary"
            onClick={() => fileRef.current?.click()}
            disabled={round.locked}
          >
            Import CSV
          </Btn>
          <input
            ref={fileRef}
            type="file"
            accept=".csv,text/csv"
            className="hidden"
            onChange={(e) => {
              if (e.target.files?.[0]) importCSV(e.target.files[0]);
              e.target.value = "";
            }}
          />
          {hasAnyScore && (
            <>
              <CopyWhatsAppBtn round={round} results={inlineResults} players={state.players} />
              <ExportRoundCsvBtn round={round} results={inlineResults} players={state.players} />
            </>
          )}
          <span className="text-xs" style={{ color: palette.inkSoft }}>
            Accepts Golf Pad export (<code>"Team","Hole#1"…"Hole#18","Net"</code>) or simple <code>Player,1,2,…,18</code>. Names match case-insensitively against the roster.
          </span>
        </div>
      </Card>

      <Card dense>
        <div className="overflow-x-auto">
          <table className="text-sm" style={{ fontVariantNumeric: "tabular-nums", minWidth: 900 }}>
            <thead>
              <tr style={{ background: "#F7F5F0", borderBottom: `1px solid ${palette.rule}` }}>
                <th className="text-left px-2 py-2 font-medium sticky left-0 z-10" style={{ background: "#F7F5F0", minWidth: 160 }}>
                  Player
                </th>
                <th className="px-1 py-2 font-medium text-xs" style={{ color: palette.inkSoft }}>CH</th>
                {Array.from({ length: 18 }, (_, i) => (
                  <th key={i} className="px-1 py-2 font-medium text-center text-xs">
                    {i + 1}
                  </th>
                ))}
                <th className="px-2 py-2 font-medium text-center">Gross</th>
                <th className="px-2 py-2 font-medium text-center">Net</th>
              </tr>
            </thead>
            <tbody>
              {activePlayers.map((p) => {
                const sc = round.scores[p.id] || Array(18).fill("");
                const filled = sc.filter((s) => s !== "" && s != null).length;
                const grossTotal =
                  filled === 18 ? sc.reduce((a, b) => a + Number(b), 0) : null;
                const ch = chOf(p);
                const netTotal = grossTotal != null ? grossTotal - ch : null;
                return (
                  <tr key={p.id} style={{ borderBottom: `1px solid ${palette.rule}` }}>
                    <td className="px-2 py-1 sticky left-0 z-10" style={{ background: "#fff" }}>
                      <div className="flex items-center gap-2">
                        <span>{p.name}</span>
                        <Pill tone={flightForRound(round, p)}>{flightForRound(round, p)}</Pill>
                      </div>
                    </td>
                    <td className="px-1 py-1 text-center text-xs" style={{ color: palette.inkSoft }}>
                      {ch}
                    </td>
                    {Array.from({ length: 18 }, (_, i) => (
                      <td key={i} className="px-0.5 py-0.5">
                        <input
                          type="number"
                          value={sc[i] ?? ""}
                          onChange={(e) => setScore(p.id, i, e.target.value)}
                          disabled={round.locked}
                          className="w-10 text-center text-sm py-1"
                          style={{
                            border: `1px solid ${palette.rule}`,
                            background: round.locked ? "#F7F5F0" : "#fff",
                            borderRadius: 2,
                            fontFamily: "ui-monospace",
                          }}
                        />
                      </td>
                    ))}
                    <td className="px-2 py-1 text-center font-medium">{grossTotal ?? "—"}</td>
                    <td className="px-2 py-1 text-center font-medium" style={{ color: palette.green }}>
                      {netTotal ?? "—"}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

    lines.push(`*Skins A* — pot ${fmt$(results.potBreakdown.skinsA)} · per skin ${fmt$(results.skinsA.skinValue)}`);
    Object.entries(results.skinsA.skinsByPlayer)
      .filter(([, v]) => v > 0)
      .sort((a, b) => b[1] - a[1])
      .forEach(([pid, n]) =>
        lines.push(`  • ${playerById[pid]?.name}: ${n} skins → ${fmt$(results.skinsA.payouts[pid])}`)

    lines.push("");

    Object.entries(results.skinsB.skinsByPlayer)
      .filter(([, v]) => v > 0)

      .forEach(([pid, n]) =>
        lines.push(`  • ${playerById[pid]?.name}: ${n} skins → ${fmt$(results.skinsB.payouts[pid])}`)
      );
    lines.push("");
    lines.push(`*Individual Net A* — pot ${fmt$(results.indNetA.pot)}`);
    results.indNetA.ranking
      .filter((r) => r.position <= 3 && (results.indNetA.payouts[r.playerId] || 0) > 0)
      .forEach((r) =>
        lines.push(`  ${r.position}. ${playerById[r.playerId]?.name} (${r.net}) → ${fmt$(results.indNetA.payouts[r.playerId])}`)
      );
    lines.push("");
    lines.push(`*Individual Net B* — pot ${fmt$(results.indNetB.pot)}`);
    results.indNetB.ranking
      .filter((r) => r.position <= 3 && (results.indNetB.payouts[r.playerId] || 0) > 0)
      .forEach((r) =>
        lines.push(`  ${r.position}. ${playerById[r.playerId]?.name} (${r.net}) → ${fmt$(results.indNetB.payouts[r.playerId])}`)
      );
    lines.push("");
    lines.push(`*Best Ball A* — pot ${fmt$(results.bestBallA.pot)}`);
    results.bestBallA.teamResults
      .filter((t) => (results.bestBallA.teamPayouts[t.teamId] || 0) > 0)

        lines.push(
          `  ${t.position}. ${t.teamName} (${t.total}) → ${fmt$(results.bestBallA.teamPayouts[t.teamId])}`

      );
    lines.push("");
    lines.push(`*Best Ball B* — pot ${fmt$(results.bestBallB.pot)}`);

      .filter((t) => (results.bestBallB.teamPayouts[t.teamId] || 0) > 0)

    const text = lines.join("\n");

function LedgerTab({ state }) {
  const playerById = Object.fromEntries(state.players.map((p) => [p.id, p]));

  // Compute results for every round, then aggregate per player.
  const allResults = state.rounds.map((r) => ({
    round: r,
    res: computeRoundResults(r, state.players),
  }));

  const cumulative = state.players.map((p) => {
    const row = {
      id: p.id,
      name: p.name,
      contrib: 0,
      winSkins: 0,
      winIN: 0,
      winBB: 0,
      won: 0,
      net: 0,
      perRound: [],
    };
    for (const { round, res } of allResults) {
      const l = res.ledger[p.id];
      if (!l) {
        row.perRound.push(null);
        continue;
      }
      row.contrib += l.contrib;
      row.winSkins += l.winSkins;
      row.winIN += l.winIN;
      row.winBB += l.winBB;
      row.won += l.won;
      row.net += l.net;
      row.perRound.push(l.net);
    }
    return row;
  });

  const totals = cumulative.reduce(
    (acc, r) => {
      acc.contrib += r.contrib;
      acc.winSkins += r.winSkins;
      acc.winIN += r.winIN;
      acc.winBB += r.winBB;
      acc.won += r.won;
      acc.net += r.net;
      return acc;
    },
    { contrib: 0, winSkins: 0, winIN: 0, winBB: 0, won: 0, net: 0 }
  );

  const exportCSV = () => {
    const headerCols = [
      "Player",
      ...state.rounds.map((r) => `R${r.number}_Net`),
      "Contribution",
      "Skins",
      "Ind.Net",
      "BestBall",
      "TotalWon",
    ];
    const rows = [headerCols.join(",")];
    cumulative.forEach((r) => {
      rows.push(
        [
          r.name,
          ...r.perRound.map((v) => (v == null ? "" : v.toFixed(2))),
          r.contrib.toFixed(2),
          r.winSkins.toFixed(2),
          r.winIN.toFixed(2),
          r.winBB.toFixed(2),
          r.won.toFixed(2),
        ].join(",")
      );
    });
    const blob = new Blob([rows.join("\n")], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "cumulative_ledger.csv";
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
        <KPI label="Total contributions" value={fmt$(totals.contrib)} sub="across all rounds" />
        <KPI label="Total winnings" value={fmt$(totals.won)} />
        <KPI
          label="Reconciliation"
          value={fmt$(totals.contrib - totals.won)}
          sub="should be $0.00 when all rounds are complete"
        />
      </div>

      <Card
        title="Cumulative ledger"
        action={<Btn variant="secondary" onClick={exportCSV}>Export CSV</Btn>}
        dense
      >
        <div className="overflow-x-auto">
          <table className="w-full text-sm" style={{ fontVariantNumeric: "tabular-nums" }}>
            <thead>
              <tr style={{ background: "#F7F5F0", borderBottom: `1px solid ${palette.rule}` }}>
                <th className="text-left px-3 py-2 font-medium">Player</th>
                {state.rounds.map((r) => (
                  <th key={r.id} className="px-3 py-2 font-medium text-right">R{r.number}</th>
                ))}
                <th className="px-3 py-2 font-medium text-right">In</th>
                <th className="px-3 py-2 font-medium text-right">Skins</th>
                <th className="px-3 py-2 font-medium text-right">IN</th>
                <th className="px-3 py-2 font-medium text-right">BB</th>
                <th className="px-3 py-2 font-medium text-right">Total a Pagar</th>
              </tr>
            </thead>
            <tbody>
              {cumulative
                .slice()
                .sort((a, b) => b.won - a.won)
                .map((r) => (
                  <tr key={r.id} style={{ borderBottom: `1px solid ${palette.rule}` }}>
                    <td className="px-3 py-2 font-medium">{r.name}</td>
                    {r.perRound.map((v, i) => (
                      <td
                        key={i}
                        className="px-3 py-2 text-right text-xs"
                        style={{
                          color: v == null ? palette.inkSoft : v >= 0 ? palette.green : palette.alert,
                        }}
                      >
                        {v == null ? "—" : (v >= 0 ? "+" : "") + fmt$(v)}
                      </td>
                    ))}
                    <td className="px-3 py-2 text-right">{fmt$(r.contrib)}</td>
                    <td className="px-3 py-2 text-right">{fmt$(r.winSkins)}</td>
                    <td className="px-3 py-2 text-right">{fmt$(r.winIN)}</td>
                    <td className="px-3 py-2 text-right">{fmt$(r.winBB)}</td>
                    <td
                      className="px-3 py-2 text-right font-bold"
                      style={{ color: r.won > 0 ? palette.green : palette.inkSoft }}
                    >
                      {r.won > 0 ? fmt$(r.won) : "—"}
                    </td>
                  </tr>
                ))}
            </tbody>
            <tfoot>
              <tr style={{ background: "#F7F5F0", borderTop: `2px solid ${palette.ink}` }}>
                <td className="px-3 py-2 font-medium uppercase text-xs tracking-wider">Totals</td>
                {state.rounds.map((r) => (
                  <td key={r.id}></td>
                ))}
                <td className="px-3 py-2 text-right font-medium">{fmt$(totals.contrib)}</td>
                <td className="px-3 py-2 text-right font-medium">{fmt$(totals.winSkins)}</td>
                <td className="px-3 py-2 text-right font-medium">{fmt$(totals.winIN)}</td>
                <td className="px-3 py-2 text-right font-medium">{fmt$(totals.winBB)}</td>
                <td className="px-3 py-2 text-right font-bold">{fmt$(totals.won)}</td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div className="px-3 py-2 text-xs" style={{ color: palette.inkSoft }}>
          "In" es la apuesta de cada jugador en los pots. "Total a Pagar" es lo que Fernando le debe al jugador (la contribución ya fue pagada por adelantado).
        </div>
      </Card>
    </div>
  );
}

          {" "}<strong>Export state.json (for hosting)</strong>: fixed filename — upload this to your GitHub Pages repo so the public audit view auto-loads it.
          Data lives in browser memory only — export to preserve across reloads.
        </div>
      </Card>

      <Card title="Payout logic — quick reference">
        <div className="text-sm space-y-2" style={{ color: palette.ink }}>
          <p>
            <strong>Per active player per round:</strong> $28 stake into pots = $18 skins + $5 individual net + $5 best ball.
            Each side game's pot is built from players entered in that game.
          </p>
          <p>
            <strong>Index vs Course Handicap:</strong> the Setup tab stores each player's <em>handicap index</em> (GHIN/WHS, e.g. 7.7).
            Per-round, the Course tab applies slope and rating to derive each player's <em>course handicap</em>:
            <span style={{ fontFamily: "ui-monospace" }}> CH = round(Index × Slope ÷ 113) + (Course Rating − Par)</span>.
            All payouts use the course handicap, not the index.
          </p>
          <p>
            <strong>Skins handicap:</strong> 75% of <em>course</em> handicap, rounded, capped at ±18. Used <em>only</em> for skins.
            Individual net and best ball use the full course handicap.
          </p>
          <p>
            <strong>Skins:</strong> separate pots for Cat A and Cat B. Net low wins each hole; ties carry over.
            Per-skin value = pot ÷ skins awarded.
          </p>
          <p>
            <strong>Individual net:</strong> separate pots for Flight A and Flight B. Within each flight, with N entrants: N≥3 → 3rd gets fixed $5, remainder 65/35; N=2 → 65/35 of full pot; N=1 → full pot.
          </p>
          <p>
            <strong>Best ball:</strong> 65/35 split. Each team's payout splits equally among its members.
          </p>
          <p>
            <strong>Ties (IN / BB):</strong> resolved by USGA count-back. If two or more players or teams tie on total net, compare net on the last 9 holes; if still tied, the last 6; then last 3; then hole 18. Net for each segment uses a proportional handicap allocation (½ × CH for last 9, ⅓ × CH for last 6, ⅙ × CH for last 3, 1⁄18 × CH for hole 18). Skins ties are handled separately by carryover.
          </p>
          <p>
            <strong>Plus indexes:</strong> when course handicap is negative, player gives back strokes on the easiest holes (highest stroke index).
          </p>
        </div>
      </Card>
    </div>
  );
}
